name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: temporary-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DRIFT_GUARD_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:temporary-ci-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
      - name: Quality, dependency audit, and lock checks
        run: bash infra/ci/checks.sh
      - name: Build, smoke test, and rehearse image rollback
        run: bash infra/scripts/check-rollback.sh
