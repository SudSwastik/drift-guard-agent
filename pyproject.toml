[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "drift-guard-agent"
version = "0.1.0"
description = "A service for API contract validation and drift investigation."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "jsonschema==4.26.0",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["drift_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
