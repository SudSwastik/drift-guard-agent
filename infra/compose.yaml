name: drift-guard-agent

services:
  drift-guard:
    image: ${DRIFT_GUARD_IMAGE:-drift-guard-agent:local}
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DRIFT_GUARD_ENVIRONMENT: ${DRIFT_GUARD_ENVIRONMENT:-local}
      DRIFT_GUARD_SERVICE_NAME: ${DRIFT_GUARD_SERVICE_NAME:-drift-guard-agent}
      DRIFT_GUARD_LOG_LEVEL: ${DRIFT_GUARD_LOG_LEVEL:-INFO}
      DRIFT_GUARD_API_KEY: ${DRIFT_GUARD_API_KEY:-}
      DRIFT_GUARD_BLOCKING_ENABLED: ${DRIFT_GUARD_BLOCKING_ENABLED:-false}
      DRIFT_GUARD_MAX_REQUEST_BYTES: ${DRIFT_GUARD_MAX_REQUEST_BYTES:-65536}
      DRIFT_GUARD_MAX_JSON_DEPTH: ${DRIFT_GUARD_MAX_JSON_DEPTH:-32}
      DRIFT_GUARD_MAX_FINDINGS: ${DRIFT_GUARD_MAX_FINDINGS:-100}
      DRIFT_GUARD_VALIDATION_TIMEOUT_SECONDS: ${DRIFT_GUARD_VALIDATION_TIMEOUT_SECONDS:-5}
      DRIFT_GUARD_VALIDATION_CONCURRENCY: ${DRIFT_GUARD_VALIDATION_CONCURRENCY:-2}
      DRIFT_GUARD_DATABASE_URL: ${DRIFT_GUARD_DATABASE_URL:-}
      DRIFT_GUARD_POSTGRES_HOST: postgres
      DRIFT_GUARD_POSTGRES_PASSWORD: ${DRIFT_GUARD_POSTGRES_PASSWORD:?Set DRIFT_GUARD_POSTGRES_PASSWORD in .env}
      DRIFT_GUARD_OBSERVATION_HMAC_KEY: ${DRIFT_GUARD_OBSERVATION_HMAC_KEY:?Set DRIFT_GUARD_OBSERVATION_HMAC_KEY in .env}
      DRIFT_GUARD_OBSERVATION_FAILURE_MODE: ${DRIFT_GUARD_OBSERVATION_FAILURE_MODE:-best_effort}
      DRIFT_GUARD_STORAGE_TIMEOUT_SECONDS: ${DRIFT_GUARD_STORAGE_TIMEOUT_SECONDS:-2}
      DRIFT_GUARD_OBSERVATION_RETENTION_DAYS: ${DRIFT_GUARD_OBSERVATION_RETENTION_DAYS:-14}
      DRIFT_GUARD_RETENTION_INTERVAL_SECONDS: ${DRIFT_GUARD_RETENTION_INTERVAL_SECONDS:-600}
      DRIFT_GUARD_DRIFT_MIN_SAMPLES: ${DRIFT_GUARD_DRIFT_MIN_SAMPLES:-10}
      DRIFT_GUARD_DRIFT_MIN_COUNT: ${DRIFT_GUARD_DRIFT_MIN_COUNT:-3}
      DRIFT_GUARD_DRIFT_MIN_RATE: ${DRIFT_GUARD_DRIFT_MIN_RATE:-0.2}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: drift_guard
      POSTGRES_PASSWORD: ${DRIFT_GUARD_POSTGRES_ADMIN_PASSWORD:?Set DRIFT_GUARD_POSTGRES_ADMIN_PASSWORD in .env}
      DRIFT_GUARD_POSTGRES_PASSWORD: ${DRIFT_GUARD_POSTGRES_PASSWORD:?Set DRIFT_GUARD_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-app.sql:/docker-entrypoint-initdb.d/init-app.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d drift_guard"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres-data:
